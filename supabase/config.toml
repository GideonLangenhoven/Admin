# create-checkout and send-whatsapp-text are called cross-function with the
# project's SERVICE_ROLE_KEY as Bearer. Supabase rotated keys to the new
# sb_secret_* format which is not a JWT, so the gateway's verify_jwt=true
# default rejects these calls with UNAUTHORIZED_INVALID_JWT_FORMAT. Both
# functions perform their own server-side validation (origin allowlist,
# business_id check, server-side pricing), so gating at the gateway adds
# no real protection.
[functions.create-checkout]
verify_jwt = false

[functions.send-whatsapp-text]
verify_jwt = false

# rebook-booking is called cross-function by wa-webhook and web-chat with the
# sb_secret_* SERVICE_ROLE_KEY (not a JWT — see note above). The function does
# its own caller authorization (service-role key, customer_session token, or
# admin JWT + business ownership), which is stronger than the gateway's
# anyone-with-the-anon-key JWT check.
[functions.rebook-booking]
verify_jwt = false

# weather-cancel is invoked from the admin app with the operator's session JWT.
# The gateway's legacy verify_jwt check rejects those tokens (the HS256/ES256
# issue _shared/auth.ts exists for), so every day/slot cancel died with a
# non-2xx before the function ran and nothing appeared in its logs. requireAuth
# inside the function validates the JWT via auth.getUser and enforces
# MAIN_ADMIN/SUPER_ADMIN on admin_users — the gateway check adds nothing.
[functions.weather-cancel]
verify_jwt = false

# admin-help-chat is invoked from the admin app with the operator's session
# JWT — same gateway HS256/ES256 issue as weather-cancel above. requireAuth
# inside the function validates the JWT and rejects non-admin callers.
[functions.admin-help-chat]
verify_jwt = false

# onboarding-wizard is driven by a client filling in the setup wizard on their
# own machine during a CS call — an anonymous caller with no Supabase session.
# The gateway JWT check would only prove the caller has the public anon key, so
# it adds nothing here. The real gate is inside the function: every action
# resolves a single-use, unexpired invite token to exactly one skeleton tenant,
# no request may supply a business_id, and the tenant stays outside the TRADING
# set until go-live. Per-IP rate limits back it up.
[functions.onboarding-wizard]
verify_jwt = false
