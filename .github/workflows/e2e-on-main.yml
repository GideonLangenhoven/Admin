name: E2E on main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-main
  cancel-in-progress: false

jobs:
  happy-path:
    name: Customer happy-path (Yoco test mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Run happy-path
        env:
          LIVE_PAYMENT_E2E: "1"
          BASE_URL: ${{ secrets.RELEASE_TEST_BOOKING_URL }}
          ADMIN_URL: ${{ secrets.RELEASE_TEST_ADMIN_URL }}
          ADMIN_EMAIL: ${{ secrets.RELEASE_TEST_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.RELEASE_TEST_ADMIN_PASSWORD }}
          TEST_CUSTOMER_EMAIL: ${{ secrets.RELEASE_TEST_CUSTOMER_EMAIL }}
          TEST_CUSTOMER_PHONE: ${{ secrets.RELEASE_TEST_CUSTOMER_PHONE }}
        run: npm run test:e2e:happy
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-happy-path-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
