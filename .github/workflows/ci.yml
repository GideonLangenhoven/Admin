name: CI

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run read-only browser smoke checks against configured deployed sites
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Admin source, dependencies and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm audit
      - run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit --incremental false
      - name: Production build with synthetic provider config
        env:
          VERCEL_ENV: preview
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://synthetic.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
        run: npm run build

  release-regressions:
    name: Companion sources, payments, isolation and edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ENV: preview
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://synthetic.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
      NEXT_PUBLIC_BUSINESS_ID: 00000000-0000-4000-8000-000000000001
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Companion commits are published on dedicated review branches.
      - uses: actions/checkout@v4
        with:
          repository: GideonLangenhoven/capekayak-booking
          ref: b29bc53992b0e516526939e94a7a14ff34fab71c
          path: booking
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GideonLangenhoven/onboarding
          ref: 293d4e4a6426f9e1ccd1205e6a9b40d012a3e4eb
          path: onboarding
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: npm ci
      - run: npm ci --prefix booking
      - run: npm ci --prefix onboarding
      - run: npm audit --prefix booking
      - run: npm audit --omit=dev --prefix booking
      - run: npm audit --prefix onboarding
      - run: npm audit --omit=dev --prefix onboarding
      - run: npm run test:unit
      - name: Local release and seed safety guards
        run: node --test tests/release-sql-plan.mjs tests/stress/release-evidence-check.test.mjs tests/stress/bt500-seed-ownership.test.mjs tests/stress/bt500-window.test.mjs
      - name: Storefront ingress and JSON-LD guards
        working-directory: booking
        run: node --experimental-strip-types --test tests/middleware-rate-limit.mjs scripts/tenant-jsonld.test.mjs
      - run: npm run check:edge
      - run: npm run test:edge-resolution
      - run: npm run lint --prefix booking
      - run: npx tsc --noEmit --incremental false --project booking/tsconfig.json
      - run: npm run check:ways --prefix booking
      - run: npm run lint --prefix onboarding
      - run: npx tsc --noEmit --incremental false --project onboarding/tsconfig.json
      - run: npm run test:contract --prefix onboarding
      - name: Build pinned storefront
        env:
          VERCEL_ENV: preview
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://synthetic.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
          NEXT_PUBLIC_BUSINESS_ID: 00000000-0000-4000-8000-000000000001
        run: npm run build --prefix booking
      - name: Build pinned onboarding
        env:
          VERCEL_ENV: preview
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://synthetic.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
        run: npm run build --prefix onboarding
      - name: Real PostgreSQL isolation and payment transactions
        env:
          ROLLOUT_TEST_USER: postgres
          ROLLOUT_TEST_PASSWORD: local-ci-only
        run: npm run test:isolation:local

  smoke-e2e:
    name: Deployed smoke E2E (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, release-regressions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
        run: npm run test:e2e:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
